name: Build APK

# The phone app is native Kotlin since lane L3 (`mobile_node/app`, Gradle 8.9, JDK 17).
# This workflow replaces one that built an APK this repository no longer produces, so
# every push showed a red check nobody could fix by touching code.
#
# The release variant is signed with the debug keystore on purpose (see
# mobile_node/app/build.gradle.kts), so CI needs no signing secret and produces the same
# artefact `make apk` does on the field laptop.

on:
  push:
    branches: [main, master, make-proper, 'experiment/**', 'lane/**']
  pull_request:
    branches: [main, master, make-proper]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 35 (mobile_node/app/build.gradle.kts); the runner's image only ships
      # the platform the last Flutter build needed, so name it explicitly.
      - name: Install SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        working-directory: mobile_node
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imu-node-${{ github.run_number }}
          path: mobile_node/app/build/outputs/apk/release/app-release.apk
          retention-days: 30