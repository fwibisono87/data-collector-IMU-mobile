name: sensors_app
description: "IMU Telemetry Mobile Node"
publish_to: 'none'
version: 2.2.0+3

# Build with Flutter 3.44.8 (Dart 3.12.x). The constraint below is satisfied by far older
# Flutter releases, which is a trap: 3.24.5 also satisfies it and silently resolves
# path_provider_android 2.2.15 — no jni, no libdartjni.so, a 22.7 MB APK instead of 52.7 MB.
# pubspec.lock is checked in to pin this; do not delete it to "fix" a resolution error.
environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Sensor
  sensors_plus: ^6.0.0

  # Permissions & storage
  permission_handler: ^11.3.0
  path_provider: ^2.1.2

  # Network
  web_socket_channel: ^2.4.5

  # Protobuf
  protobuf: ^3.1.0

  # UUID for device_id
  uuid: ^4.4.0

  # Persistent storage
  shared_preferences: ^2.2.3

  # Foreground service (resilience §9.3)
  flutter_foreground_task: ^8.0.0

  # Battery level for preflight check
  battery_plus: ^5.0.3

  # Utilities
  intl: ^0.19.0
  crypto: ^3.0.3

  # Connectivity alarm sound (5.x keeps minSdkVersion 21 — do not jump to 6.x)
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/